<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>东盟页面连接诊断</title>
    <style>
      * { box-sizing: border-box; }
      body { background: #f5f7fb; color: #102033; font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; }
      main { background: #fff; border: 1px solid #d8e0ea; border-radius: 16px; margin: auto; max-width: 780px; padding: 24px; }
      h1 { font-size: 25px; margin-top: 0; }
      p { color: #475569; line-height: 1.7; }
      pre { background: #f1f5f9; border-radius: 8px; font: 13px/1.8 monospace; overflow-wrap: anywhere; padding: 16px; white-space: pre-wrap; }
      button, a { background: #7a0019; border: 0; border-radius: 8px; color: #fff; display: inline-block; font-size: 14px; margin: 8px 8px 0 0; padding: 12px 16px; text-decoration: none; }
      button { cursor: pointer; }
      button:disabled { opacity: .6; }
      iframe { height: 844px; left: -10000px; position: absolute; top: 0; width: 390px; }
    </style>
  </head>
  <body>
    <main>
      <h1>东盟页面连接诊断</h1>
      <p>请保持当前 Clash 设置。此页会检查后端、网页、脚本、样式和实际页面启动，不会创建游客账号，也不会上传账号密码或检查结果。</p>
      <pre id="results" aria-live="polite">诊断准备中……</pre>
      <p id="summary">等待检测。</p>
      <button id="retry" type="button">重新检测</button>
      <a href="./#/experience">打开东盟体验</a>
      <noscript><p>检测失败：浏览器禁用了 JavaScript，请允许此网站运行脚本。</p></noscript>
    </main>
    <script>
      var diagnosticScript = document.createElement('script');
      diagnosticScript.src = './connection-check.js';
      diagnosticScript.onerror = function () {
        document.getElementById('results').textContent = '检测失败：诊断脚本无法下载。说明 HTML 可达，但脚本资源在当前链路上无法加载。';
        document.getElementById('summary').textContent = '请将此页面连同地址栏截图发给维护人员。';
      };
      document.body.appendChild(diagnosticScript);
    </script>
  </body>
</html>
