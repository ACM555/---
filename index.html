<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>东盟跨境商事法律 AI 助手</title>
    <style>
      .boot-fallback {
        align-items: center;
        background: linear-gradient(135deg, #082044, #0f3467);
        color: #fff;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .boot-fallback-card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
        max-width: 520px;
        padding: 32px;
        width: 100%;
      }

      .boot-fallback-card h1 {
        font-size: 28px;
        margin: 0 0 12px;
      }

      .boot-fallback-card p {
        line-height: 1.7;
        margin: 0;
        opacity: 0.86;
      }

      .boot-fallback-card a {
        color: #fff;
        display: inline-block;
        margin-top: 18px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <section class="boot-fallback-card">
          <h1>东盟跨境商事法律 AI 助手</h1>
          <p id="boot-status">页面正在加载，请稍候。如果长时间未进入，请打开连接诊断。</p>
          <a href="./connection-check.html">打开连接诊断</a>
          <noscript><p>浏览器已禁用 JavaScript，无法启动体验页面。</p></noscript>
        </section>
      </main>
    </div>
    <script src="%BASE_URL%boot-check.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
